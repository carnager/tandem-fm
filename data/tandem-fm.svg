<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f86f7"/>
      <stop offset="1" stop-color="#2b55c9"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc56b"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg)"/>
  <!-- the two panels -->
  <rect x="40" y="52" width="82" height="152" rx="14" fill="#ffffff"/>
  <rect x="134" y="52" width="82" height="152" rx="14" fill="#ffffff" fill-opacity="0.72"/>
  <!-- rows of files -->
  <g fill="#2b55c9" fill-opacity="0.85">
    <rect x="54" y="72" width="54" height="10" rx="5"/>
    <rect x="54" y="94" width="40" height="10" rx="5"/>
    <rect x="54" y="116" width="48" height="10" rx="5"/>
    <rect x="54" y="138" width="34" height="10" rx="5"/>
  </g>
  <g fill="#2b55c9" fill-opacity="0.45">
    <rect x="148" y="72" width="44" height="10" rx="5"/>
    <rect x="148" y="94" width="54" height="10" rx="5"/>
    <rect x="148" y="116" width="36" height="10" rx="5"/>
  </g>
  <!-- the transfer between them -->
  <circle cx="128" cy="176" r="34" fill="url(#arrow)" stroke="#2b55c9" stroke-width="6"/>
  <path d="M110 176 H142 M130 162 L144 176 L130 190" fill="none" stroke="#ffffff" stroke-width="9"
